name: Build and Deploy
on:
  push:
    branches:
      - master
      - feat/fix_npmjs_workflow

permissions:
  id-token: write  # Required for OIDC
  contents: read

jobs:
  install-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org/'
      - name: Install dependencies
        run: |
          npm install
      - name: Test with jest
        run: |
          npm run test
      - name: Publish
        # 增加 --provenance 標誌（這是 OIDC 模式的最佳實踐，能與 GitHub 建立強關聯）
        run: npm publish --access public --provenance
        env:
          # 確保在執行時環境中不帶任何可能干擾的 NPM Token 變數
          NODE_AUTH_TOKEN: ""
