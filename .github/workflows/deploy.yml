name: Build and Deploy

on:
  push:
    branches:
      - master
      - feat/*          # ← 加上你原本就有的 feat 分支

permissions:
  id-token: write
  contents: read

jobs:
  publish:              # ← 改名更清楚（可選）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'                    # ← 升級到最新 LTS
          registry-url: 'https://registry.npmjs.org/'

      - name: Install dependencies
        run: npm ci                             # ← 更乾淨

      - name: Test with jest
        run: npm test

      - name: Publish
        run: npm publish --access public --provenance   # ← 加上 provenance